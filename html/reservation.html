<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation - TheFoodHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../images/logo-website.png" type="image/png" sizes="32x32">
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="../index.html" class="logo">The Food<span>Hub</span></a>
    <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="reservation.html" class="active">Reservation</a>
    </nav>
    <div class="nav-actions">
      <button class="wishlist-nav-btn" aria-label="View wishlist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="wishlist-badge">0</span>
      </button>
      <button class="cart-btn" aria-label="View order">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.68 12.39a2 2 0 0 0 2 1.61h8.64a2 2 0 0 0 2-1.61L22 6.5H6"/></svg>
        <span class="cart-badge">0</span>
      </button>
      <a href="reservation.html" class="btn btn-primary">Book a Table</a>
      <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">Book a Table</span>
    <h1>Reserve Your Table</h1>
  </div>
</section>

<section>
  <div class="container" style="max-width:700px;">
    <div class="form-card">

      <form id="reservationForm" novalidate>
        <div class="form-group">
          <label for="res-name">Full Name</label>
          <input type="text" id="res-name" name="name" placeholder="Your name" required>
          <span class="form-error"></span>
        </div>

        <div class="form-group">
          <label for="res-phone">Phone Number</label>
          <input type="tel" id="res-phone" name="phone" placeholder="012 345 678" required>
          <span class="form-error"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="res-date">Date</label>
            <input type="date" id="res-date" name="date" required>
            <span class="form-error"></span>
          </div>
          <div class="form-group">
            <label for="res-time">Time</label>
            <input type="time" id="res-time" name="time" required>
            <span class="form-error"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="res-guests">Number of Guests</label>
          <select id="res-guests" name="guests" required>
            <option value="">Select guests</option>
            <option value="1">1 Guest</option>
            <option value="2">2 Guests</option>
            <option value="3">3 Guests</option>
            <option value="4">4 Guests</option>
            <option value="5+">5+ Guests</option>
          </select>
          <span class="form-error"></span>
        </div>

        <div class="form-group">
          <label for="res-notes">Special Requests (optional)</label>
          <textarea id="res-notes" name="notes" rows="3" placeholder="Allergies, celebrations, seating preferences..."></textarea>
          <span class="form-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Reserve Now</button>
        <div class="form-success" id="reservationSuccess">
          <span>✓</span> Thank you! Your reservation has been received.
        </div>
      </form>
    </div>
  </div>
</section>

<button class="scroll-top" aria-label="Scroll to top">↑</button>

<script src="../js/script.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/wishlist.js"></script>
<script src="../js/validation.js"></script>

</body>
</html>
